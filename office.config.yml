# ============================================================
#  Konfigurasi Kantor AI Software Engineer
#  Edit file ini sekali, semua agent membacanya.
# ============================================================
office:
  language: id                  # bahasa komunikasi agent
  workspace_dir: workspace      # tempat repo di-clone (gh repo clone)

git:
  base_branch_candidates: [main, master]       # dicek berurutan, tanya user bila keduanya ada
  protected_branches: [main, master, develop]  # agent TIDAK PERNAH commit/push langsung ke sini
  branch_name_policy: user-provided            # nama branch SELALU dari user, agent tidak boleh mengarang
  allow_local_commits_on_feature_branch: true
  allow_push_without_approval: false
  allow_force_push: false

docmost:                        # Strand / Docmost MCP yang sudah kamu setup
  mcp_server_name: strand       # nama server di .mcp.json (tool jadi mcp__strand__*)
  system_parent_page_id: ""     # halaman "<System> Tech Doc" (induk semua Service Tech Doc)
  rfc_parent_page_id: ""        # halaman induk tempat RFC disimpan
  # ID template ada di office-config/platform-notes.md

jira:
  base_url: ""                  # contoh: https://namaperusahaan.atlassian.net/browse/
  default_project_key: ""

testing:
  mock: [external_client, third_party_client]   # WAJIB di-mock
  never_mock: [repository, database]            # JANGAN di-mock
  require_seed_and_cleanup: true
  assert: [affected_table_fields, response]
  run_only_affected_tests: true                 # dilarang dotnet test tanpa --filter

# Daftar proyek. Diisi/diperbarui lewat: /scan-project <nama>  (atau edit manual)
