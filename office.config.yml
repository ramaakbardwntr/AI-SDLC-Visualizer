# ============================================================
#  Konfigurasi Kantor AI Software Engineer
#  Edit file ini sekali, semua agent membacanya.
# ============================================================
office:
  language: en                  # visualizer UI and documentation language
  workspace_dir: workspace      # local repository clone target (gh repo clone)

git:
  base_branch_candidates: [main, master]       # checked sequentially; confirm if both exist
  protected_branches: [main, master, develop]  # agents NEVER commit/push directly to protected branches
  branch_name_policy: user-provided            # branch names are strictly provided by user
  allow_local_commits_on_feature_branch: true
  allow_push_without_approval: false
  allow_force_push: false

docmost:                        # Strand / Docmost MCP integration
  mcp_server_name: strand       # server name in .mcp.json (tools prefixed with mcp__strand__*)
  system_parent_page_id: ""     # "<System> Tech Doc" root page ID
  rfc_parent_page_id: ""        # RFC root page ID

jira:
  base_url: ""                  # example: https://company.atlassian.net/browse/
  default_project_key: ""

testing:
  mock: [external_client, third_party_client]   # mock external clients only
  never_mock: [repository, database]            # NEVER mock repository or database
  require_seed_and_cleanup: true
  assert: [affected_table_fields, response]
  run_only_affected_tests: true                 # run filtered unit tests only (--filter)

